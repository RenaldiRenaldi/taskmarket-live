name: Update market data (hourly)

on:
  schedule:
    - cron: '7 * * * *'  # hourly, a few minutes past the hour
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch data + build page
        run: |
          node scripts/fetch-data.mjs
          node scripts/build.mjs

      - name: Commit data snapshot
        run: |
          git config user.name "taskmarket-live-bot"
          git config user.email "taskmarket-live-bot@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
